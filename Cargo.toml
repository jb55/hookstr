[workspace]
resolver = "2"
members = [
    "crates/hookstr-core",
    "crates/hookstrd",
    "crates/hookstr_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hookstr-core = { path = "crates/hookstr-core" }

# The relay (nostrdb_net::relay::server), drain sync (nostrdb_net::relay::sync)
# and nostrdb itself all come from the one nostrdb-rs workspace, so nostrdb_net's
# nostrdb and ours are the same package. Pinned to the `sync-progress` branch;
# bump both revs together.
nostrdb = { git = "https://github.com/damus-io/nostrdb-rs", rev = "e22e5632a75e" }
nostrdb_net = { git = "https://github.com/damus-io/nostrdb-rs", rev = "e22e5632a75e" }

# Keygen only. Same version nostr/notedeck pin so one copy builds.
secp256k1 = { version = "0.30", features = ["rand", "std"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
axum = { version = "0.8", features = ["macros"] }
# wss:// support for the drain client comes from nostrdb_net's own
# tokio-tungstenite, so hookstr doesn't declare tokio-tungstenite itself.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
redb = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
base64 = "0.22.1"
hex = "0.4.3"
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
anyhow = "1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
