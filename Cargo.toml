[workspace]
resolver = "2"
members = [
    "crates/hookstr-core",
    "crates/hookstrd",
    "crates/hookstr_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hookstr-core = { path = "crates/hookstr-core" }

# MUST match the pin in nostrdb-relay / nostr-relay-sync (same URL + rev) so
# types unify. That pin is kernelkind's fork because notedeck rides it: the
# rev carries SendFilter + other commits not yet on damus-io master.
nostrdb = { git = "https://github.com/kernelkind/nostrdb-rs", rev = "aca2f66e3579dee0c9245e4c66100dd12cd940d6" }

# Extracted from notedeck as standalone repos so hookstr builds anywhere.
nostrdb_relay = { git = "https://github.com/jb55/nostrdb-relay", rev = "28f9d854eb6abe48c79fcf2374d0dbcb8cd3abc5" }
nostr_relay_sync = { git = "https://github.com/jb55/nostr-relay-sync", rev = "f61f2952948fb4d2bfdb3fd8375b95eac1c11f3e" }

# Keygen only. Same version nostr/notedeck pin so one copy builds.
secp256k1 = { version = "0.30", features = ["rand", "std"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
axum = { version = "0.8", features = ["macros"] }
# Version must stay in lockstep with notedeck's pin (0.24) so feature
# unification gives relay_sync's connect_async TLS support for wss:// —
# see SPIKE.md "Gap: wss".
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
redb = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
base64 = "0.22.1"
hex = "0.4.3"
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
anyhow = "1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
