[workspace]
resolver = "2"
members = [
    "crates/hookstr-core",
    "crates/hookstrd",
    "crates/hookstr_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hookstr-core = { path = "crates/hookstr-core" }

# The relay (nostrdb_net::relay::server), drain sync (nostrdb_net::relay::sync)
# and nostrdb itself all come from the one nostrdb-rs workspace, so nostrdb_net's
# nostrdb and ours are the same package — no cross-repo pin-lockstep to keep in
# sync. During dev these point at a local checkout of the `nostrdb_net` branch;
# swap to a git rev before landing.
# TODO(pin): nostrdb  = { git = "https://github.com/damus-io/nostrdb-rs", rev = "<rev>" }
#            nostrdb_net = { git = "https://github.com/damus-io/nostrdb-rs", rev = "<rev>" }
nostrdb = { path = "/home/jb55/dev/nostrdb-rs/nostrdb_rs" }
nostrdb_net = { path = "/home/jb55/dev/nostrdb-rs/nostrdb_net" }

# Keygen only. Same version nostr/notedeck pin so one copy builds.
secp256k1 = { version = "0.30", features = ["rand", "std"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
axum = { version = "0.8", features = ["macros"] }
# hookstrd serves ws (relay) and plain HTTP (ingest) on one port: it owns the
# accept loop, peeks each connection, and hands non-ws ones to the axum Router
# over a single hyper connection. wss:// support for the drain client comes from
# nostrdb_net's own tokio-tungstenite (rustls-tls-webpki-roots), so hookstr no
# longer declares tokio-tungstenite itself.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
redb = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
base64 = "0.22.1"
hex = "0.4.3"
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
anyhow = "1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
