# Publish the hookstrd landing page to GitHub Pages.
#
# The pages live at crates/hookstrd/src/{landing,docs}.html and are embedded in
# the hookstrd binary with include_str!, so those files stay the single source
# of truth — this workflow just copies them (landing.html -> index.html,
# docs.html -> docs.html) rather than keeping a second copy in the tree that
# could drift. The relative "docs.html" / "./" links between the two resolve
# the same way here as they do off hookstrd (which serves docs at /docs.html).
#
# Elements marked `instance-only` (the "relay online" badge, the "point your
# client at wss://<this host>" note) are true when a real hookstrd serves the
# page and false on a static docs site, so they get hidden here.
name: pages

on:
  push:
    branches: [master]
    paths:
      - crates/hookstrd/src/landing.html
      - crates/hookstrd/src/docs.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp crates/hookstrd/src/landing.html _site/index.html
          cp crates/hookstrd/src/docs.html _site/docs.html
          # No Jekyll processing; the pages are already final HTML.
          touch _site/.nojekyll
          # Hide the bits that only make sense when hookstrd itself is serving
          # (the "relay online" badge, the wss:// note). Injected as CSS before
          # </head> so no HTML rewriting is needed. docs.html has no
          # instance-only elements today, but process it the same way so a
          # future one is hidden automatically.
          python3 - <<'EOF'
          from pathlib import Path
          css = '<style>.instance-only{display:none !important}</style>\n'
          marker = '</head>'
          for name in ('index.html', 'docs.html'):
              p = Path('_site') / name
              html = p.read_text()
              assert marker in html, f'{name} has no </head>'
              p.write_text(html.replace(marker, css + marker, 1))
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
