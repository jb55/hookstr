# hookstr drain config: sync stored webhooks from hookstrd and replay them
# against local consumers. Lives at ~/.config/hookstr/config.toml (or
# $XDG_CONFIG_HOME/hookstr/config.toml); pass --config to point elsewhere.
# Paths are used verbatim (no ~ expansion); relative paths resolve against
# the cwd you run the drain from.
relay_url = "wss://hooks.example.com"
db_path = "/var/lib/hookstr-cli/ndb"
redb_path = "/var/lib/hookstr-cli/replays.redb"
nsec_path = "/var/lib/hookstr-cli/drain.nsec"

# Deliveries are self-describing: the event's path tag mirrors everything
# after the token in the ingest URL, so everything replays to
# {target_base}/{path} when the consumer's route mirrors the ingest path.
target_base = "http://localhost:3000/webhooks"

# Optional per-path overrides for consumers whose route doesn't mirror the
# ingest path (e.g. a second app on another port).
#[targets]
#"acme/events" = "http://localhost:4000/hooks"
