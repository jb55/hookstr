[package]
name = "hookstr_cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hookstr"
path = "src/main.rs"

[dependencies]
hookstr-core.workspace = true
nostrdb.workspace = true
nostr_relay_sync.workspace = true
secp256k1.workspace = true
tokio.workspace = true
# Same version as nostr_relay_sync's featureless pin; declaring the TLS
# feature here is what gives its connect_async wss:// support via feature
# unification. See SPIKE.md "Gap: wss".
tokio-tungstenite.workspace = true
futures-util.workspace = true
reqwest.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
hex.workspace = true
# std on top of the workspace's no-default-features pin: keygen `?`s a
# bech32::EncodeError into anyhow, which needs it to be a std Error.
bech32 = { workspace = true, features = ["std"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The e2e test runs the real hookstrd ingest router + relay in-process and
# drives this crate's binary against them.
hookstrd = { path = "../hookstrd" }
nostrdb_relay.workspace = true
axum.workspace = true
tempfile = "3"
# The e2e drives the drain binary as a child process.
tokio = { workspace = true, features = ["process"] }
