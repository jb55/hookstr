[package]
name = "hookstr_cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hookstr"
path = "src/main.rs"

[dependencies]
hookstr-core.workspace = true
nostrdb.workspace = true
nostrdb_net.workspace = true
secp256k1.workspace = true
# process + io-util: drain --exec spawns the command and writes its stdin.
tokio = { workspace = true, features = ["process", "io-util"] }
futures-util.workspace = true
reqwest.workspace = true
redb.workspace = true
serde.workspace = true
# preserve_order: --exec/peek --json envelopes keep header order and the
# body's own key order instead of sorting keys.
serde_json = { workspace = true, features = ["preserve_order"] }
base64.workspace = true
toml.workspace = true
clap.workspace = true
hex.workspace = true
# std on top of the workspace's no-default-features pin: keygen `?`s a
# bech32::EncodeError into anyhow, which needs it to be a std Error.
bech32 = { workspace = true, features = ["std"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The e2e test runs the real hookstrd ingest router + relay in-process and
# drives this crate's binary against them.
hookstrd = { path = "../hookstrd" }
nostrdb_net.workspace = true
axum.workspace = true
tempfile = "3"
serde_json.workspace = true
base64.workspace = true
# The e2e drives the drain binary as a child process.
tokio = { workspace = true, features = ["process"] }
